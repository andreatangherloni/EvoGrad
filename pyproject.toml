[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evograd-diff"
version = "0.3.0"
description = "PyTorch-based framework for differentiable evolutionary computation and swarm intelligence"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Andrea Tangherloni", email = "andrea.tangherloni@unibocconi.it" },
]
keywords = [
    "evolutionary computation",
    "genetic algorithm",
    "differential evolution",
    "particle swarm optimization",
    "CMA-ES",
    "differentiable programming",
    "pytorch",
    "optimization",
    "metaheuristics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
]

[project.urls]
Homepage = "https://github.com/andreatangherloni/EvoGrad"
Repository = "https://github.com/andreatangherloni/EvoGrad"
Issues = "https://github.com/andreatangherloni/EvoGrad/issues"

[tool.hatch.build.targets.wheel]
packages = ["evograd"]

[tool.hatch.build.targets.wheel.force-include]
"evograd/benchmarks/functions/cec2017/data.pkl" = "evograd/benchmarks/functions/cec2017/data.pkl"

# Restrict the source distribution to the package and standard metadata so that
# repo-only files (paper source, notebooks, .claude/, scratch scripts, lockfile)
# are not shipped to PyPI.
[tool.hatch.build.targets.sdist]
include = [
    "/evograd",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
